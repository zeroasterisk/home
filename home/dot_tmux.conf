# ~/.tmux.conf — managed by chezmoi
# Standalone config — does NOT require the gpakosz/.tmux framework.
# (The old .tmux.conf.local was written for that framework and is now unused.)

# ── Prefix ────────────────────────────────────────────────────────────────────
# Keep default C-b
set -g prefix C-b
bind C-b send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g history-limit 50000
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on    # re-number on close
set -g escape-time 10         # faster escape
set -g focus-events on        # pass focus to vim

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # true color

# ── Mouse ─────────────────────────────────────────────────────────────────────
set -g mouse on

# ── Vi mode ───────────────────────────────────────────────────────────────────
set -g status-keys vi
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Clipboard ─────────────────────────────────────────────────────────────────
# Linux (xclip/xsel) — silently no-ops if not available
if -b 'command -v xclip' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
if -b 'command -v xsel' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel --clipboard --input"'
# macOS
if -b 'command -v pbcopy' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# ── Windows & panes ───────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"    # new window keeps path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom

set -g status-style fg=colour244,bg=colour234
set -g status-left-length 40
set -g status-right-length 80

set -g status-left  '#[fg=colour232,bg=colour154,bold] #S #[fg=colour154,bg=colour234,nobold]'
set -g status-right '#[fg=colour244] %Y-%m-%d  %H:%M #[fg=colour232,bg=colour154,bold] #h '

setw -g window-status-format         ' #I:#W '
setw -g window-status-current-format '#[fg=colour232,bg=colour39,bold] #I:#W #[fg=colour39,bg=colour234,nobold]'
setw -g window-status-style          fg=colour244,bg=colour234
setw -g window-status-current-style  fg=colour232,bg=colour39,bold

# pane borders
set -g pane-border-style        fg=colour238
set -g pane-active-border-style fg=colour39

# ── Reload ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
