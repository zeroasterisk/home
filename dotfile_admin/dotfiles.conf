# Symlinks (relative to DOTFILES_DIR:absolute path in HOME)
SYMLINKS=(
  "asdf:$HOME/.asdf"
  "oh-my-zsh:$HOME/.oh-my-zsh"
  "gem/gemrc:$HOME/.gemrc"
  "git:$HOME/.git"
  "git/gitconfig:$HOME/.gitconfig"
  "git/gitk:$HOME/.gitk"
  "tmux/.tmux.conf:$HOME/.tmux.conf"
  "tmux.conf.local:$HOME/.tmux.conf.local"
  "terminfo:$HOME/.terminfo"
  "bin:$HOME/bin"
  "vim:$HOME/.vim"
  "vim/vimrc:$HOME/.vimrc"
  "config/nvim/init.vim:$HOME/.config/nvim/init.vim"
  "zsh:$HOME/.zsh"
  "zsh/zshrc:$HOME/.zshrc"
  "zsh/p10k.zsh:$HOME/.p10k.zsh"
  "tool-versions:$HOME/.tool-versions"
)

# ASDF Plugins (name:url)
ASDF_PLUGINS=(
